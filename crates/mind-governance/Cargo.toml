[package]
name = "mind-governance"
version.workspace = true
edition.workspace = true

[dependencies]
# E.EGRESS1: every HTTP request routes through the machine's egress proxy (loopback direct).
mind-net = { workspace = true }
mind-types = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
getrandom = "0.2"
ed25519-dalek = "2"
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", features = ["clock"] }

[dev-dependencies]
tokio = { workspace = true }
